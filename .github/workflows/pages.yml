name: Prepare Download Page Publication

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: download-page
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare public site artefact
        run: |
          mkdir -p _site/assets/icons/dark _site/assets/icons/beta/dark
          cp docs/index.html _site/index.html
          cp docs/.nojekyll _site/.nojekyll
          cp assets/icons/icon-32.png _site/assets/icons/icon-32.png
          cp assets/icons/icon-256.png _site/assets/icons/icon-256.png
          cp assets/icons/icon-rounded.png _site/assets/icons/icon-rounded.png
          cp assets/icons/dark/icon-32.png _site/assets/icons/dark/icon-32.png
          cp assets/icons/dark/icon-rounded.png _site/assets/icons/dark/icon-rounded.png
          cp assets/icons/beta/icon-rounded.png _site/assets/icons/beta/icon-rounded.png
          cp assets/icons/beta/dark/icon-rounded.png _site/assets/icons/beta/dark/icon-rounded.png

      - name: Seal Pages publication bundle
        run: |
          set -euo pipefail
          mkdir -p publication/caul
          cp -R _site/. publication/caul/
          touch publication/.nojekyll
          (
            cd publication
            {
              printf '.nojekyll\0'
              find caul -type f -print0 | LC_ALL=C sort -z
            } |
              xargs -0 sha256sum > SHA256SUMS
          )
          printf '%s\n' \
            "Caul download-page publication bundle" \
            "source-commit=${{ github.sha }}" \
            "destination=apotenza92/apotenza92.github.io:caul/" \
            "Apply these exact reviewed bytes manually." \
            > publication/PUBLICATION.txt

      - name: Upload Pages publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caul-pages-publication-${{ github.sha }}
          path: publication
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

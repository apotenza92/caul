name: Build and Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "1.88"

concurrency:
  group: caul-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release ref
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_environment: ${{ steps.release.outputs.release_environment }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify tag commit is on main
        env:
          CAUL_RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DEFAULT_BRANCH" != main ]]; then
            echo "Repository default branch $DEFAULT_BRANCH is not the approved release source main." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "refs/tags/$CAUL_RELEASE_TAG^{commit}")"
          MAIN_COMMIT="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$TAG_COMMIT" = "$RELEASE_SHA"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"; then
            echo "Release tag $CAUL_RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          fi

      - name: Validate tag and package version
        id: release
        env:
          CAUL_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = require('./package.json');
          const tag = process.env.CAUL_RELEASE_TAG;
          const stable = /^v\d+\.\d+\.\d+$/.test(tag);
          const prerelease = /^v\d+\.\d+\.\d+-beta\.[1-9]\d*$/.test(tag);
          if (!stable && !prerelease) {
            throw new Error(`Release ref must be vX.Y.Z or vX.Y.Z-beta.N with N >= 1; received ${tag}`);
          }
          if (packageJson.version !== tag.slice(1)) {
            throw new Error(`Tag ${tag} does not match package version ${packageJson.version}`);
          }
          const values = stable
            ? ['channel=stable', 'prerelease=false', 'release_environment=stable-release']
            : ['channel=beta', 'prerelease=true', 'release_environment=beta-release'];
          values.push(`tag=${tag}`, `version=${tag.slice(1)}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${values.join('\n')}\n`);
          NODE

  quality:
    name: Required checks
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  build-macos:
    name: Build macOS ARM64
    needs: [prepare, quality]
    runs-on: macos-26
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Prepare macOS resources
        run: npm run package:prepare:mac
        timeout-minutes: 45

      - name: Build, sign, notarise and verify macOS artefacts
        run: |
          set -euo pipefail

          npm run release:mac:signed -- --channel "$CAUL_RELEASE_CHANNEL" --skip-prepare

          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            mkdir -p release/stable-yml-backup
            cp release/*.yml release/stable-yml-backup/ || true
            npm run release:mac:signed -- --channel beta --skip-prepare
            cp release/stable-yml-backup/latest*.yml release/ || true
            rm -rf release/stable-yml-backup
          fi
        timeout-minutes: 75
        env:
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Verify macOS app signatures
        env:
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail

          node scripts/verify-macos-package.mjs --channel "$CAUL_RELEASE_CHANNEL" --require-checksum
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            node scripts/verify-macos-package.mjs --channel beta --require-checksum
          fi

      - name: Upload macOS artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: |
            release/*.zip
            release/latest*.yml
            release/beta*.yml
            release/*.blockmap
            release/*.sha256
            release/notarization-*.json
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Build Windows artefacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm run dist:win:${{ matrix.arch }}
          node scripts/verify-native-package.mjs --platform windows --arch ${{ matrix.arch }} --channel $env:CAUL_RELEASE_CHANNEL

          if ($env:CAUL_RELEASE_CHANNEL -eq "stable") {
            $env:FORCE_BETA_BUILD = "true"
            $env:CAUL_PACKAGE_PLATFORM = "win"
            $env:CAUL_PACKAGE_ARCH = "${{ matrix.arch }}"
            npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --${{ matrix.arch }} --publish=never
            node scripts/verify-native-package.mjs --platform windows --arch ${{ matrix.arch }} --channel beta
          }
        timeout-minutes: 75
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            release/*windows-${{ matrix.arch }}-setup.exe
            release/*windows-${{ matrix.arch }}-setup.exe.blockmap
          if-no-files-found: error

      - name: Install, launch and uninstall published NSIS packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Resolve-InstalledFile {
            param(
              [string]$Root,
              [string]$Pattern,
              [string]$Label
            )
            $deadline = (Get-Date).AddSeconds(90)
            do {
              $matches = @(Get-ChildItem -Path $Root -Recurse -File -Filter $Pattern -ErrorAction SilentlyContinue)
              if ($matches.Count -eq 1) { return $matches[0] }
              if ($matches.Count -gt 1) {
                throw "Multiple $Label files found under ${Root}: $($matches.FullName -join ', ')"
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            $contents = @(Get-ChildItem -Path $Root -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            throw "$Label missing under ${Root} after installer completion. Contents: $($contents -join ', ')"
          }
          $installers = Get-ChildItem release -File -Filter "*windows-${{ matrix.arch }}-setup.exe"
          if ($installers.Count -ne ${{ needs.prepare.outputs.channel == 'stable' && 2 || 1 }}) {
            throw "Unexpected NSIS installer count: $($installers.Count)"
          }
          foreach ($installer in $installers) {
            $installRoot = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($installer.Name))
            $installStartedAt = Get-Date
            # NSIS requires /D= to be the final unquoted argument.
            $arguments = "/S /D=$installRoot"
            $process = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$($installer.Name) installation failed: $($process.ExitCode)" }
            $product = if ($installer.Name -like 'Caul-Beta-*') { 'Caul Beta' } else { 'Caul' }
            try {
              $executable = (Resolve-InstalledFile -Root $installRoot -Pattern "$product.exe" -Label 'Installed executable').FullName
            }
            catch {
              & ./scripts/write-windows-defender-evidence.ps1 -Since $installStartedAt -InstallRoot $installRoot
              throw
            }
            $env:CAUL_DISABLE_MODEL_AUTO_DOWNLOAD = '1'
            $env:CAUL_DISABLE_UPDATE_CHECKS = '1'
            $env:CAUL_PACKAGED_LAUNCH_SMOKE_MS = '250'
            $env:CAUL_USER_DATA_DIR = Join-Path $installRoot 'smoke-user-data'
            $process = Start-Process -FilePath $executable -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$product launch failed: $($process.ExitCode)" }
            $uninstaller = Resolve-InstalledFile -Root $installRoot -Pattern 'Uninstall*.exe' -Label 'Uninstaller'
            $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$product uninstall failed: $($process.ExitCode)" }
            $deadline = (Get-Date).AddSeconds(90)
            while ((Test-Path $executable) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path $executable) { throw "$product executable remains after uninstall: $executable" }
          }

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y cpio libasound2-dev rpm xvfb

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Build Linux artefacts
        run: |
          set -euo pipefail

          npm run dist:linux:${{ matrix.arch }}
          node scripts/verify-native-package.mjs --platform linux --arch ${{ matrix.arch }} --channel "$CAUL_RELEASE_CHANNEL"

          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            linux_targets=(AppImage rpm)
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              linux_targets=(AppImage)
            fi
            FORCE_BETA_BUILD=true CAUL_PACKAGE_PLATFORM=linux CAUL_PACKAGE_ARCH=${{ matrix.arch }} npx --no-install electron-builder --config electron-builder.config.cjs --linux "${linux_targets[@]}" --${{ matrix.arch }} --publish=never
            FORCE_BETA_BUILD=true node scripts/build-linux-deb.mjs ${{ matrix.arch }}
            node scripts/verify-native-package.mjs --platform linux --arch ${{ matrix.arch }} --channel beta
          fi
        timeout-minutes: 75
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Upload Linux artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/*-${{ matrix.arch }}.AppImage
            release/*-${{ matrix.arch }}.deb
            release/*-${{ matrix.arch }}.rpm
          if-no-files-found: error

  test-macos-updater:
    name: macOS updater ${{ matrix.scenario }} (${{ matrix.variant }})
    needs: [prepare, build-macos]
    runs-on: macos-15
    environment:
      name: ${{ matrix.variant }}-updater-verification
    permissions:
      attestations: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [corrupt, signature, valid]
        variant: ${{ fromJSON(needs.prepare.outputs.channel == 'stable' && '["stable","beta"]' || '["beta"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Download current signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: candidate

      - name: Resolve previous public channel release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          node <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8')).flat();
          const variant = process.env.RELEASE_VARIANT;
          const asset = variant === 'beta' ? 'Caul-Beta-macos-arm64.zip' : 'Caul-macos-arm64.zip';
          const previous = releases
            .filter(release => !release.draft && release.tag_name !== process.env.RELEASE_TAG)
            .filter(release => variant === 'beta' || !release.prerelease)
            .filter(release => release.assets.some(candidate => candidate.name === asset))
            .sort((left, right) => String(right.published_at).localeCompare(String(left.published_at)))[0];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, previous
            ? `available=true\ntag=${previous.tag_name}\nasset=${asset}\n`
            : `available=false\nasset=${asset}\n`);
          NODE

      - name: Authorise first-channel bootstrap
        if: steps.previous.outputs.available != 'true'
        env:
          MACOS_UPDATER_BOOTSTRAP_TAG: ${{ vars.MACOS_UPDATER_BOOTSTRAP_TAG }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$MACOS_UPDATER_BOOTSTRAP_TAG"
          test "$MACOS_UPDATER_BOOTSTRAP_TAG" = "$RELEASE_TAG"
          mkdir updater-evidence
          printf '{"result":"bootstrap-no-prior-public-release","tag":"%s","channel":"%s","scenario":"%s"}\n' \
            "$RELEASE_TAG" "${{ matrix.variant }}" "${{ matrix.scenario }}" \
            > "updater-evidence/${{ matrix.scenario }}-${{ matrix.variant }}.json"

      - name: Download and verify previous public package
        if: steps.previous.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir previous
          gh release download "${{ steps.previous.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.previous.outputs.asset }}" --dir previous
          if gh release download "${{ steps.previous.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir previous; then
            awk -v expected="${{ steps.previous.outputs.asset }}" '$2 == expected { print }' previous/SHA256SUMS > previous/PRIOR_SHA256SUM
            test "$(wc -l < previous/PRIOR_SHA256SUM | tr -d ' ')" = 1
            (cd previous && shasum -a 256 -c PRIOR_SHA256SUM)
            gh attestation verify "previous/${{ steps.previous.outputs.asset }}" --repo "$GITHUB_REPOSITORY"
          else
            node scripts/verify-legacy-updater-baseline.mjs \
              --tag "${{ steps.previous.outputs.tag }}" \
              --asset "${{ steps.previous.outputs.asset }}" \
              --file "previous/${{ steps.previous.outputs.asset }}"
          fi

      - name: Run updater integration scenario
        if: steps.previous.outputs.available == 'true'
        env:
          MACOS_UPDATER_LEGACY_PUBLIC_BOOTSTRAP_TAG: ${{ vars.MACOS_UPDATER_LEGACY_PUBLIC_BOOTSTRAP_TAG }}
          APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RELEASE_SCENARIO: ${{ matrix.scenario }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VARIANT: ${{ matrix.variant }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          CANDIDATE="candidate/${{ steps.previous.outputs.asset }}"
          if [[ "$RELEASE_SCENARIO" == valid && "$MACOS_UPDATER_LEGACY_PUBLIC_BOOTSTRAP_TAG" == "$RELEASE_TAG" ]]; then
            mkdir updater-evidence
            printf '{"result":"deferred-public-n-1","priorTag":"%s","candidateTag":"%s","channel":"%s","scenario":"%s"}\n' \
              "${{ steps.previous.outputs.tag }}" "$RELEASE_TAG" "$RELEASE_VARIANT" "$RELEASE_SCENARIO" \
              > "updater-evidence/$RELEASE_SCENARIO-$RELEASE_VARIANT.json"
            exit 0
          fi
          INSTALLED="$CANDIDATE"
          [[ "$RELEASE_SCENARIO" == valid ]] && INSTALLED="previous/${{ steps.previous.outputs.asset }}"
          TEST_CANDIDATE="$CANDIDATE"
          if [[ "$RELEASE_SCENARIO" == signature ]]; then
            mkdir adversarial
            ditto -x -k "$CANDIDATE" adversarial/extracted
            PRODUCT='Caul'
            [[ "$RELEASE_VARIANT" == beta ]] && PRODUCT='Caul Beta'
            APP="adversarial/extracted/$PRODUCT.app"
            printf 'signature rejection fixture\n' > "$APP/Contents/Resources/update-signature-rejection.txt"
            codesign --force --deep --sign - "$APP"
            TEST_CANDIDATE="adversarial/${{ steps.previous.outputs.asset }}"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$TEST_CANDIDATE"
          fi
          npm run test:macos-updater -- \
            --prior-zip "$INSTALLED" \
            --candidate-zip "$TEST_CANDIDATE" \
            --trusted-candidate-zip "$CANDIDATE" \
            --channel "$RELEASE_VARIANT" \
            --scenario "$RELEASE_SCENARIO" \
            --candidate-tag "$RELEASE_TAG" \
            --expected-version "$RELEASE_VERSION"
          mkdir updater-evidence
          printf '{"result":"passed","priorTag":"%s","candidateTag":"%s","channel":"%s","scenario":"%s"}\n' \
            "${{ steps.previous.outputs.tag }}" "$RELEASE_TAG" "$RELEASE_VARIANT" "$RELEASE_SCENARIO" \
            > "updater-evidence/$RELEASE_SCENARIO-$RELEASE_VARIANT.json"

      - name: Upload updater evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-macos-arm64-${{ matrix.variant }}-${{ matrix.scenario }}
          path: updater-evidence
          if-no-files-found: error
          retention-days: 30

  test-windows-upgrade:
    name: Windows N-1 upgrade (${{ matrix.arch }})
    needs: [prepare, build-windows]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-2025
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Download signed candidate installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: candidate

      - name: Download and authenticate previous public installers
        shell: pwsh
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if (-not $release.tag_name -or $release.tag_name -eq '${{ needs.prepare.outputs.tag }}') {
            throw "A distinct previous stable release is required for the Windows upgrade gate."
          }
          New-Item -ItemType Directory -Force prior | Out-Null
          $names = @('Caul-Beta-windows-${{ matrix.arch }}-setup.exe')
          if ($env:CAUL_RELEASE_CHANNEL -eq 'stable') {
            $names = @('Caul-windows-${{ matrix.arch }}-setup.exe') + $names
          }
          foreach ($name in $names) {
            gh release download $release.tag_name --repo $env:GITHUB_REPOSITORY --pattern $name --dir prior
            $asset = $release.assets | Where-Object name -eq $name
            if (-not $asset -or -not $asset.digest.StartsWith('sha256:')) {
              throw "GitHub did not provide a SHA-256 digest for $name."
            }
            $actual = (Get-FileHash "prior/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            if ($actual -ne $expected) { throw "Previous public installer digest mismatch for $name." }
          }
          "PRIOR_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upgrade stable and beta while preserving user data
        shell: pwsh
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = @(
            @{
              Channel = 'beta'
              Prefix = 'Caul-Beta'
              Product = 'Caul Beta'
            }
          )
          if ($env:CAUL_RELEASE_CHANNEL -eq 'stable') {
            $variants = @(
              @{
                Channel = 'stable'
                Prefix = 'Caul'
                Product = 'Caul'
              }
            ) + $variants
          }
          try {
            foreach ($variant in $variants) {
              $variant.InstallRoot = Join-Path $env:RUNNER_TEMP "caul-$($variant.Channel)-install"
              $variant.UserData = Join-Path $env:RUNNER_TEMP "caul-$($variant.Channel)-user-data"
              $priorInstaller = Join-Path $PWD "prior/$($variant.Prefix)-windows-${{ matrix.arch }}-setup.exe"
              $process = Start-Process -FilePath $priorInstaller -ArgumentList @('/S', "/D=$($variant.InstallRoot)") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$($variant.Product) prior installation failed: $($process.ExitCode)" }
              $executable = Join-Path $variant.InstallRoot "$($variant.Product).exe"
              if (-not (Test-Path $executable)) { throw "Previous executable missing: $executable" }
              New-Item -ItemType Directory -Force $variant.UserData | Out-Null
              $env:CAUL_DISABLE_MODEL_AUTO_DOWNLOAD = '1'
              $env:CAUL_DISABLE_UPDATE_CHECKS = '1'
              $env:CAUL_PACKAGED_LAUNCH_SMOKE_MS = '250'
              $env:CAUL_USER_DATA_DIR = $variant.UserData
              $process = Start-Process -FilePath $executable -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$($variant.Product) prior launch failed: $($process.ExitCode)" }
              Set-Content -Path (Join-Path $variant.UserData 'upgrade-preservation-marker.txt') -Value "$($variant.Channel)-$env:PRIOR_TAG"
            }

            foreach ($variant in $variants) {
              $candidateInstaller = Join-Path $PWD "candidate/$($variant.Prefix)-windows-${{ matrix.arch }}-setup.exe"
              $process = Start-Process -FilePath $candidateInstaller -ArgumentList @('/S', "/D=$($variant.InstallRoot)") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$($variant.Product) candidate installation failed: $($process.ExitCode)" }
              $executable = Join-Path $variant.InstallRoot "$($variant.Product).exe"
              $env:CAUL_USER_DATA_DIR = $variant.UserData
              $process = Start-Process -FilePath $executable -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$($variant.Product) upgraded launch failed: $($process.ExitCode)" }
              node scripts/verify-native-package.mjs `
                --platform windows `
                --arch '${{ matrix.arch }}' `
                --channel $variant.Channel `
                --release-dir candidate `
                --unpacked-dir $variant.InstallRoot
              $marker = Join-Path $variant.UserData 'upgrade-preservation-marker.txt'
              if ((Get-Content $marker -Raw).Trim() -ne "$($variant.Channel)-$env:PRIOR_TAG") {
                throw "$($variant.Product) did not preserve existing user data."
              }
            }
            if ($env:CAUL_RELEASE_CHANNEL -eq 'stable'
              -and (-not (Test-Path (Join-Path $variants[0].InstallRoot 'Caul.exe'))
                -or -not (Test-Path (Join-Path $variants[1].InstallRoot 'Caul Beta.exe')))) {
              throw 'Stable and beta Windows applications did not coexist after upgrade.'
            }
          }
          finally {
            foreach ($variant in $variants) {
              if (-not $variant.ContainsKey('InstallRoot')) { continue }
              $uninstaller = Get-ChildItem $variant.InstallRoot -File -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($uninstaller) {
                Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait | Out-Null
              }
            }
          }

  test-linux-upgrade:
    name: Linux N-1 upgrade (${{ matrix.arch }})
    needs: [prepare, build-linux]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio libasound2-dev rpm xvfb
          npm ci

      - name: Download candidate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: candidate

      - name: Download and authenticate previous public packages
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          prior_tag="$(jq -r .tag_name <<<"$release_json")"
          test -n "$prior_tag"
          test "$prior_tag" != '${{ needs.prepare.outputs.tag }}'
          mkdir prior
          names=("caul-beta-${{ matrix.arch }}.deb")
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            names=("caul-${{ matrix.arch }}.deb" "${names[@]}")
          fi
          for name in "${names[@]}"; do
            gh release download "$prior_tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir prior
            expected="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            [[ "$expected" == sha256:* ]]
            actual="$(sha256sum "prior/$name" | cut -d' ' -f1)"
            test "$actual" = "${expected#sha256:}"
          done
          echo "PRIOR_TAG=$prior_tag" >> "$GITHUB_ENV"

      - name: Upgrade stable and beta while preserving user data
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          CAUL_DISABLE_MODEL_AUTO_DOWNLOAD: "1"
          CAUL_DISABLE_UPDATE_CHECKS: "1"
          CAUL_PACKAGED_LAUNCH_SMOKE_MS: "250"
        run: |
          set -euo pipefail
          cleanup() {
            sudo dpkg --remove caul caul-beta >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          prior_packages=("$PWD/prior/caul-beta-${{ matrix.arch }}.deb")
          candidate_packages=("$PWD/candidate/caul-beta-${{ matrix.arch }}.deb")
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            prior_packages=("$PWD/prior/caul-${{ matrix.arch }}.deb" "${prior_packages[@]}")
            candidate_packages=("$PWD/candidate/caul-${{ matrix.arch }}.deb" "${candidate_packages[@]}")
          fi
          sudo apt-get install -y "${prior_packages[@]}"
          stable_data="$RUNNER_TEMP/caul-stable-user-data"
          beta_data="$RUNNER_TEMP/caul-beta-user-data"
          mkdir -p "$stable_data" "$beta_data"
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            CAUL_USER_DATA_DIR="$stable_data" xvfb-run -a caul --no-sandbox
            printf 'stable-%s\n' "$PRIOR_TAG" > "$stable_data/upgrade-preservation-marker.txt"
          fi
          CAUL_USER_DATA_DIR="$beta_data" xvfb-run -a caul-beta --no-sandbox
          printf 'beta-%s\n' "$PRIOR_TAG" > "$beta_data/upgrade-preservation-marker.txt"

          sudo apt-get install -y "${candidate_packages[@]}"
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            test "$(dpkg-query -W -f='${Version}' caul)" = '${{ needs.prepare.outputs.version }}'
            node scripts/verify-native-package.mjs \
              --platform linux \
              --arch '${{ matrix.arch }}' \
              --channel stable \
              --release-dir candidate \
              --public-only true
            CAUL_USER_DATA_DIR="$stable_data" xvfb-run -a caul --no-sandbox
            test "$(cat "$stable_data/upgrade-preservation-marker.txt")" = "stable-$PRIOR_TAG"
            command -v caul
          fi
          test "$(dpkg-query -W -f='${Version}' caul-beta)" = '${{ needs.prepare.outputs.version }}'
          node scripts/verify-native-package.mjs \
            --platform linux \
            --arch '${{ matrix.arch }}' \
            --channel beta \
            --release-dir candidate \
            --public-only true
          CAUL_USER_DATA_DIR="$beta_data" xvfb-run -a caul-beta --no-sandbox
          test "$(cat "$beta_data/upgrade-preservation-marker.txt")" = "beta-$PRIOR_TAG"
          command -v caul-beta
          trap - EXIT
          cleanup

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
      - test-macos-updater
      - test-windows-upgrade
      - test-linux-upgrade
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.prepare.outputs.release_environment }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded-artifacts
          pattern: release-*

      - name: Assemble exact release asset set
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: node scripts/assemble-release-assets.mjs --input downloaded-artifacts --output release-assets --channel "$CAUL_RELEASE_CHANNEL"

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/**/*

      - name: Stage, verify and publish exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to mutate an already-published release.' >&2
              exit 1
            }
          else
            CREATE_ARGS=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Caul ${RELEASE_TAG#v}" --generate-notes --draft)
            [[ "$RELEASE_PRERELEASE" == true ]] && CREATE_ARGS+=(--prerelease)
            gh release create "${CREATE_ARGS[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' | LC_ALL=C sort > existing-assets.txt
          comm -23 existing-assets.txt expected-assets.txt > unexpected-assets.txt
          if [[ -s unexpected-assets.txt ]]; then
            echo 'Draft contains unexpected immutable assets:' >&2
            cat unexpected-assets.txt >&2
            exit 1
          fi
          mkdir existing-download
          if [[ -s existing-assets.txt ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-download
            while IFS= read -r asset_name; do
              cmp "release-assets/$asset_name" "existing-download/$asset_name"
            done < existing-assets.txt
          fi
          comm -13 existing-assets.txt expected-assets.txt > missing-assets.txt
          while IFS= read -r asset_name; do
            gh release upload "$RELEASE_TAG" "release-assets/$asset_name" --repo "$GITHUB_REPOSITORY"
          done < missing-assets.txt
          mkdir verified-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-download
          find verified-download -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-assets.txt
          diff --unified expected-assets.txt actual-assets.txt
          cmp release-assets/SHA256SUMS verified-download/SHA256SUMS
          (cd verified-download && sha256sum --check SHA256SUMS)
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

  verify-public-release:
    name: Verify public release provenance
    needs: [prepare, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Re-download and verify every public asset
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir public-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir public-release
          (
            cd public-release
            sha256sum --check SHA256SUMS
          )
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { expectedReleaseAssetNames } from './scripts/assemble-release-assets.mjs';
          const expected = [...expectedReleaseAssetNames(process.env.CAUL_RELEASE_CHANNEL), 'SHA256SUMS'].sort();
          const actual = readdirSync('public-release').sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Public release asset mismatch.\nExpected: ${expected.join(', ')}\nActual: ${actual.join(', ')}`);
          }
          NODE
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = "$RELEASE_PRERELEASE"
          test "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG"
          if [[ "$RELEASE_PRERELEASE" == false ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          fi
          while IFS= read -r -d '' asset_path; do
            gh attestation verify "$asset_path" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$GITHUB_SHA"
          done < <(find public-release -maxdepth 1 -type f -print0)
          while IFS= read -r url; do
            env -u GH_TOKEN curl --fail --location --silent --show-error --head "$url" >/dev/null
          done < <(jq -r '.assets[].browser_download_url' <<<"$release_json")

  verify-public-windows:
    name: Verify public Windows packages (${{ matrix.arch }})
    needs: [prepare, publish-release, verify-public-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-2025
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Download public Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force public-release | Out-Null
          gh release download '${{ needs.prepare.outputs.tag }}' `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'SHA256SUMS' `
            --pattern 'Caul*-windows-${{ matrix.arch }}-setup.exe*' `
            --dir public-release
          $manifest = Get-Content public-release/SHA256SUMS
          Get-ChildItem public-release -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            $line = $manifest | Where-Object { $_ -match "  $([regex]::Escape($_.Name))$" }
            if (-not $line) { throw "Missing public checksum for $($_.Name)" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Public checksum mismatch for $($_.Name)" }
          }

      - name: Install, inspect and launch both public variants
        shell: pwsh
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = @(
            @{ Channel = 'beta'; Prefix = 'Caul-Beta'; Product = 'Caul Beta' }
          )
          if ($env:CAUL_RELEASE_CHANNEL -eq 'stable') {
            $variants = @(
              @{ Channel = 'stable'; Prefix = 'Caul'; Product = 'Caul' }
            ) + $variants
          }
          try {
            foreach ($variant in $variants) {
              $variant.InstallRoot = Join-Path $env:RUNNER_TEMP "public-$($variant.Channel)-install"
              $installer = Join-Path $PWD "public-release/$($variant.Prefix)-windows-${{ matrix.arch }}-setup.exe"
              $installStartedAt = Get-Date
              $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$($variant.InstallRoot)") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$($variant.Product) public installation failed: $($process.ExitCode)" }
              $expectedExecutable = Join-Path $variant.InstallRoot "$($variant.Product).exe"
              if (-not (Test-Path $expectedExecutable)) {
                & ./scripts/write-windows-defender-evidence.ps1 `
                  -Since $installStartedAt `
                  -InstallRoot $variant.InstallRoot
                throw "$($variant.Product) public installation is missing $expectedExecutable."
              }
              node scripts/verify-native-package.mjs `
                --platform windows `
                --arch '${{ matrix.arch }}' `
                --channel $variant.Channel `
                --release-dir public-release `
                --unpacked-dir $variant.InstallRoot
            }
            if ($env:CAUL_RELEASE_CHANNEL -eq 'stable'
              -and (-not (Test-Path (Join-Path $variants[0].InstallRoot 'Caul.exe'))
                -or -not (Test-Path (Join-Path $variants[1].InstallRoot 'Caul Beta.exe')))) {
              throw 'Stable and beta public Windows applications did not coexist.'
            }
          }
          finally {
            foreach ($variant in $variants) {
              if (-not $variant.ContainsKey('InstallRoot')) { continue }
              $uninstaller = Get-ChildItem $variant.InstallRoot -File -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($uninstaller) {
                Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait | Out-Null
              }
            }
          }

  verify-public-linux:
    name: Verify public Linux packages (${{ matrix.arch }})
    needs: [prepare, publish-release, verify-public-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio libasound2-dev rpm xvfb
          npm ci

      - name: Download and authenticate public Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir public-release
          gh release download '${{ needs.prepare.outputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --pattern '*-${{ matrix.arch }}.AppImage' \
            --pattern '*-${{ matrix.arch }}.deb' \
            --dir public-release
          if [[ '${{ matrix.arch }}' == x64 ]]; then
            gh release download '${{ needs.prepare.outputs.tag }}' \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*-${{ matrix.arch }}.rpm' \
              --dir public-release
          fi
          awk -v arch='${{ matrix.arch }}' '$2 == "SHA256SUMS" || $2 ~ ("-" arch "\\.(AppImage|deb|rpm)$")' \
            public-release/SHA256SUMS > public-release/PLATFORM_SHA256SUMS
          (
            cd public-release
            sha256sum --check PLATFORM_SHA256SUMS
          )

      - name: Inspect, install and launch both public variants
        env:
          CAUL_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          CAUL_DISABLE_MODEL_AUTO_DOWNLOAD: "1"
          CAUL_DISABLE_UPDATE_CHECKS: "1"
          CAUL_PACKAGED_LAUNCH_SMOKE_MS: "250"
        run: |
          set -euo pipefail
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            node scripts/verify-native-package.mjs \
              --platform linux \
              --arch '${{ matrix.arch }}' \
              --channel stable \
              --release-dir public-release \
              --public-only true
          fi
          node scripts/verify-native-package.mjs \
            --platform linux \
            --arch '${{ matrix.arch }}' \
            --channel beta \
            --release-dir public-release \
            --public-only true
          cleanup() {
            sudo dpkg --remove caul caul-beta >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          packages=("$PWD/public-release/caul-beta-${{ matrix.arch }}.deb")
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            packages=("$PWD/public-release/caul-${{ matrix.arch }}.deb" "${packages[@]}")
          fi
          sudo apt-get install -y "${packages[@]}"
          stable_data="$RUNNER_TEMP/public-caul-stable-user-data"
          beta_data="$RUNNER_TEMP/public-caul-beta-user-data"
          mkdir -p "$stable_data" "$beta_data"
          if [[ "$CAUL_RELEASE_CHANNEL" == stable ]]; then
            CAUL_USER_DATA_DIR="$stable_data" xvfb-run -a caul --no-sandbox
            command -v caul
          fi
          CAUL_USER_DATA_DIR="$beta_data" xvfb-run -a caul-beta --no-sandbox
          command -v caul-beta
          trap - EXIT
          cleanup

  prepare-homebrew-publication:
    name: Prepare Homebrew publication (Stable)
    needs: [prepare, publish-release, verify-public-release]
    runs-on: macos-15
    permissions:
      contents: read
    if: needs.prepare.outputs.channel == 'stable'
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and calculate hashes
        id: hashes
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          BASE_URL="https://github.com/apotenza92/caul/releases/download/v${VERSION}"
          mkdir public-release
          for name in \
            Caul-macos-arm64.zip \
            Caul-macos-arm64.zip.blockmap \
            Caul-macos-arm64.zip.sha256 \
            latest-mac.yml \
            notarization-stable-macos-arm64.json \
            Caul-Beta-macos-arm64.zip \
            Caul-Beta-macos-arm64.zip.blockmap \
            Caul-Beta-macos-arm64.zip.sha256 \
            beta-mac.yml \
            notarization-beta-macos-arm64.json; do
            curl -fL "${BASE_URL}/${name}" -o "public-release/${name}"
          done
          STABLE_SHA256="$(shasum -a 256 public-release/Caul-macos-arm64.zip | cut -d' ' -f1)"
          echo "STABLE_SHA256=${STABLE_SHA256}" >> "$GITHUB_OUTPUT"
          BETA_SHA256="$(shasum -a 256 public-release/Caul-Beta-macos-arm64.zip | cut -d' ' -f1)"
          echo "BETA_SHA256=${BETA_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Independently verify public macOS packages
        env:
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-macos-package.mjs \
            --channel stable \
            --release-dir public-release \
            --require-checksum
          node scripts/verify-macos-package.mjs \
            --channel beta \
            --release-dir public-release \
            --require-checksum

      - name: Generate and validate Homebrew casks
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          STABLE_SHA256="${{ steps.hashes.outputs.STABLE_SHA256 }}"
          BETA_SHA256="${{ steps.hashes.outputs.BETA_SHA256 }}"

          brew tap apotenza92/tap
          TAP_PATH="$(brew --repository apotenza92/tap)"
          cd "$TAP_PATH"
          rm -f Casks/susura.rb 'Casks/susura@beta.rb'
          export HOMEBREW_NO_AUTO_UPDATE=1
          prior_stable_version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Casks/caul.rb)"
          prior_beta_version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' 'Casks/caul@beta.rb')"
          test -n "$prior_stable_version"
          test -n "$prior_beta_version"
          test "$prior_stable_version" != "$VERSION"
          test "$prior_beta_version" != "$VERSION"
          cleanup() {
            brew uninstall --cask apotenza92/tap/caul@beta >/dev/null 2>&1 || true
            brew uninstall --cask apotenza92/tap/caul >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          brew install --cask apotenza92/tap/caul apotenza92/tap/caul@beta
          test -d '/Applications/Caul.app'
          test -d '/Applications/Caul Beta.app'
          mkdir -p "$HOME/Library/Application Support/Caul" "$HOME/Library/Application Support/Caul Beta"
          printf 'stable-%s\n' "$prior_stable_version" > "$HOME/Library/Application Support/Caul/upgrade-preservation-marker.txt"
          printf 'beta-%s\n' "$prior_beta_version" > "$HOME/Library/Application Support/Caul Beta/upgrade-preservation-marker.txt"

          CHECKSUMS="$RUNNER_TEMP/caul-homebrew-SHA256SUMS"
          printf '%s  %s\n%s  %s\n' \
            "$STABLE_SHA256" 'Caul-macos-arm64.zip' \
            "$BETA_SHA256" 'Caul-Beta-macos-arm64.zip' > "$CHECKSUMS"
          node "$GITHUB_WORKSPACE/scripts/generate-homebrew-casks.mjs" \
            --channel stable --version "$VERSION" --sha256sums "$CHECKSUMS" --output Casks

          brew style --cask apotenza92/tap/caul apotenza92/tap/caul@beta
          brew audit --cask --online apotenza92/tap/caul apotenza92/tap/caul@beta
          brew upgrade --cask apotenza92/tap/caul apotenza92/tap/caul@beta
          test "$(cat "$HOME/Library/Application Support/Caul/upgrade-preservation-marker.txt")" = "stable-$prior_stable_version"
          test "$(cat "$HOME/Library/Application Support/Caul Beta/upgrade-preservation-marker.txt")" = "beta-$prior_beta_version"
          test -d '/Applications/Caul.app'
          test -d '/Applications/Caul Beta.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/Applications/Caul.app/Contents/Info.plist')" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/Applications/Caul Beta.app/Contents/Info.plist')" = "$VERSION"

          for app_path in '/Applications/Caul.app' '/Applications/Caul Beta.app'; do
            if [[ "$app_path" == '/Applications/Caul.app' ]]; then
              executable_path="$app_path/Contents/MacOS/Caul"
            else
              executable_path="$app_path/Contents/MacOS/Caul Beta"
            fi
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            smoke_dir="$(mktemp -d "$RUNNER_TEMP/caul-homebrew-smoke.XXXXXX")"
            env -i HOME="$smoke_dir" PATH=/usr/bin:/bin:/usr/sbin:/sbin TMPDIR="$smoke_dir" \
              CAUL_DISABLE_UPDATE_CHECKS=1 CAUL_SMOKE_EXIT_MS=1000 CAUL_USER_DATA_DIR="$smoke_dir/user-data" \
              "$executable_path"
           done
           cleanup
           for app_path in '/Applications/Caul.app' '/Applications/Caul Beta.app'; do
             test ! -e "$app_path"
           done
           trap - EXIT

          mkdir -p "$GITHUB_WORKSPACE/publication/Casks"
          cp Casks/caul.rb 'Casks/caul@beta.rb' "$GITHUB_WORKSPACE/publication/Casks/"

      - name: Seal Homebrew publication bundle
        run: |
          set -euo pipefail
          casks="$(find publication/Casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'caul.rb caul@beta.rb' ]]
          (
            cd publication
            find Casks -type f -name '*.rb' -print0 |
              LC_ALL=C sort -z |
              xargs -0 shasum -a 256 > SHA256SUMS
          )
          printf '%s\n' \
            "Caul Homebrew publication bundle" \
            "release-tag=${{ needs.prepare.outputs.tag }}" \
            "release-commit=${{ github.sha }}" \
            "destination=apotenza92/homebrew-tap:Casks/" \
            "Apply these exact natively validated bytes manually after the release approval gate." \
            > publication/PUBLICATION.txt

      - name: Upload Homebrew publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caul-homebrew-publication-${{ needs.prepare.outputs.tag }}
          path: publication
          if-no-files-found: error
          retention-days: 14

  prepare-homebrew-beta-publication:
    name: Prepare Homebrew publication (Beta)
    needs: [prepare, publish-release, verify-public-release]
    runs-on: macos-15
    permissions:
      contents: read
    if: needs.prepare.outputs.channel == 'beta'
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and calculate hash
        id: hashes
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          curl -fL "https://github.com/apotenza92/caul/releases/download/v${VERSION}/Caul-Beta-macos-arm64.zip" -o beta.zip
          BETA_SHA256="$(shasum -a 256 beta.zip | cut -d' ' -f1)"
          echo "BETA_SHA256=${BETA_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Generate and validate Homebrew beta cask
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          BETA_SHA256="${{ steps.hashes.outputs.BETA_SHA256 }}"

          brew tap apotenza92/tap
          TAP_PATH="$(brew --repository apotenza92/tap)"
          cd "$TAP_PATH"
          rm -f 'Casks/susura@beta.rb'
          CHECKSUMS="$RUNNER_TEMP/caul-homebrew-SHA256SUMS"
          printf '%s  %s\n' "$BETA_SHA256" 'Caul-Beta-macos-arm64.zip' > "$CHECKSUMS"
          node "$GITHUB_WORKSPACE/scripts/generate-homebrew-casks.mjs" \
            --channel beta --version "$VERSION" --sha256sums "$CHECKSUMS" --output Casks

          export HOMEBREW_NO_AUTO_UPDATE=1
          brew style --cask apotenza92/tap/caul@beta
          brew audit --cask --online apotenza92/tap/caul@beta
          installed_cask='apotenza92/tap/caul@beta'
          cleanup() { brew uninstall --cask "$installed_cask" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          brew install --cask "$installed_cask"
          xcrun stapler validate '/Applications/Caul Beta.app'
          spctl --assess --type execute --verbose=4 '/Applications/Caul Beta.app'
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/caul-homebrew-smoke.XXXXXX")"
          env -i HOME="$smoke_dir" PATH=/usr/bin:/bin:/usr/sbin:/sbin TMPDIR="$smoke_dir" \
            CAUL_DISABLE_UPDATE_CHECKS=1 CAUL_SMOKE_EXIT_MS=1000 CAUL_USER_DATA_DIR="$smoke_dir/user-data" \
            '/Applications/Caul Beta.app/Contents/MacOS/Caul Beta'
          brew uninstall --cask "$installed_cask"
          installed_cask=''
          test ! -e '/Applications/Caul Beta.app'
          trap - EXIT

          mkdir -p "$GITHUB_WORKSPACE/publication/Casks"
          cp 'Casks/caul@beta.rb' "$GITHUB_WORKSPACE/publication/Casks/"

      - name: Seal Homebrew beta publication bundle
        run: |
          set -euo pipefail
          casks="$(find publication/Casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'caul@beta.rb' ]]
          (
            cd publication
            find Casks -type f -name '*.rb' -print0 |
              LC_ALL=C sort -z |
              xargs -0 shasum -a 256 > SHA256SUMS
          )
          printf '%s\n' \
            "Caul Beta Homebrew publication bundle" \
            "release-tag=${{ needs.prepare.outputs.tag }}" \
            "release-commit=${{ github.sha }}" \
            "destination=apotenza92/homebrew-tap:Casks/" \
            "Apply this exact natively validated byte stream manually after the release approval gate." \
            > publication/PUBLICATION.txt

      - name: Upload Homebrew beta publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caul-homebrew-publication-${{ needs.prepare.outputs.tag }}
          path: publication
          if-no-files-found: error
          retention-days: 14

name: CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
  workflow_dispatch:

env:
  NODE_VERSION: "22.22.1"
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Static checks and deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Check renderer and TypeScript
        run: npm run check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Verify bundled dependency licences
        run: node scripts/verify-pi-licences.cjs

  platform-preflight:
    name: Build preflight (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-26
            platform: mac
            arch: arm64
            package_script: package:prepare:mac
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            package_script: package:prepare:win
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            package_script: package:prepare:linux
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Verify Windows release script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @(
            './scripts/test-windows-upgrade.ps1',
            './scripts/verify-public-windows.ps1',
            './scripts/write-windows-defender-evidence.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script`n$($errors | ForEach-Object Message | Out-String)"
            }
          }

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Build platform resources
        run: npm run ${{ matrix.package_script }}
        env:
          CAUL_PACKAGE_PLATFORM: ${{ matrix.platform }}
          CAUL_PACKAGE_ARCH: ${{ matrix.arch }}
